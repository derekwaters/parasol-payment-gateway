---
- name: Get Repo Info
  hosts: all
  gather_facts: false
  connection: local

  tasks:
    - name: Do the thing
      ansible.builtin.include_role:
        name: nexus_get_repo
      vars:
        nexus_get_repo_format: maven
        nexus_get_repo_type: proxy
        nexus_get_repo_name: lightwell-validated-java

    - name: Debug It
      ansible.builtin.debug:
        var: nexus_api_result